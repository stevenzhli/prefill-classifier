[project]
name = "prefill-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "plotnine>=0.15.8",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]


[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
